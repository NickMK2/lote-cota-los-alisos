<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <title>Post cuadrado - Lote en Cota</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1080px;
      margin: 0;
      overflow: hidden;
      font-family: Inter, Arial, sans-serif;
      color: #ffffff;
      background: #183b2d;
    }

    .post {
      position: relative;
      width: 1080px;
      height: 1080px;
      display: grid;
      align-content: end;
      padding: 84px;
      background:
        linear-gradient(180deg, rgba(24, 59, 45, 0.08) 0%, rgba(24, 59, 45, 0.92) 72%),
        url("../assets/img/hero-lote.jpg") center/cover no-repeat;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: #efe3c6;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      max-width: 900px;
      margin: 0;
      font-size: 92px;
      line-height: 0.98;
      letter-spacing: 0;
    }

    .facts {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 42px;
    }

    .facts span {
      min-height: 62px;
      display: inline-flex;
      align-items: center;
      padding: 0 28px;
      border-radius: 999px;
      color: #183b2d;
      background: #ffffff;
      font-size: 29px;
      font-weight: 900;
    }

    .contact {
      margin-top: 48px;
      font-size: 34px;
      font-weight: 800;
      color: #efe3c6;
    }
  </style>
</head>

<body>
  <main class="post">
    <p class="eyebrow">Venta directa en Cota</p>
    <h1>Lote en Los Alisos</h1>
    <div class="facts">
      <span>152,67 m²</span>
      <span>$320M COP negociable</span>
      <span>Servicios disponibles</span>
    </div>
    <div class="contact">WhatsApp: +57 302 832 7122</div>
  </main>
</body>

</html>
